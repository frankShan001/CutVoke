[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cutvoke"
version = "0.1.0"
description = "A local video editing workspace shared by people and external AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "frankShan001" }]
keywords = ["video", "editing", "agent", "mcp", "ffmpeg", "timeline", "nle"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]

[project.optional-dependencies]
dev = ["pytest>=7", "numpy>=1.24", "Pillow>=10"]

[project.scripts]
cutvoke = "cutvoke.main:main"
cutvoke-mcp = "cutvoke.core.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

# Built Web files are copied into the wheel by setup.py. Keep package data
# explicit so local __pycache__ files never leak into distributables.
[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
cutvoke = ["assets/*/*.wav", "assets/*/*.png", "assets/*/*.json", "assets/*/*.cube"]
