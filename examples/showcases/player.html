<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CutVoke · 完整剪辑演示</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#152234;font:16px/1.65 system-ui,sans-serif}main{max-width:1040px;margin:auto;padding:40px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:32px;letter-spacing:-.04em;margin:8px 0}p{color:#576478}select{font:inherit;padding:10px;border:1px solid #c8d0dd;border-radius:8px;background:white}article{margin:32px 0 48px}h2{font-size:22px;margin:0 0 12px}video{display:block;width:100%;max-height:76vh;background:#10151c;border-radius:10px;object-fit:contain}article.portrait video{width:auto;max-width:100%;height:76vh;margin:auto}a{color:#205ab8}a:focus-visible,select:focus-visible{outline:3px solid #3677d9;outline-offset:4px}.note{font-size:14px}footer{border-top:1px solid #ddd;padding:20px 0;font-size:14px}@media(max-width:600px){main{padding:24px 16px}header{align-items:start}h1{font-size:26px}article.portrait video{height:auto;max-height:72vh;width:100%}}</style><main><header><div><strong>CutVoke</strong><h1>完整剪辑演示</h1></div><label>语言 <select id="language"><option value="zh-CN">简体中文</option><option value="en">English</option></select></label></header><p>原始素材与完整剪辑。有声音，可暂停、拖动进度、调节音量和全屏观看。</p><div id="films"></div><footer>视频直接来自 GitCode 仓库。按需加载，不自动播放。<br><a href="https://gitcode.com/shansjl/CutVoke">查看 CutVoke 项目</a></footer></main><script>const items=[{"title": "CHASE THE LIGHT", "lang": "en", "url": "https://raw.gitcode.com/shansjl/CutVoke/blobs/be0897f4fed7fe6869d188c7e54bbfad1e19afcd/examples/showcases/chase-the-light/videos/motorcycle-case_en.mp4", "poster": "chase-the-light/previews/motorcycle-poster_en.jpg", "portrait": false}, {"title": "逐光而行", "lang": "zh-CN", "url": "https://raw.gitcode.com/shansjl/CutVoke/blobs/d7c695df7edf271d4964701c6dd297e1e2b1ec05/examples/showcases/chase-the-light/videos/motorcycle-case_zh-CN.mp4", "poster": "chase-the-light/previews/motorcycle-poster_zh-CN.jpg", "portrait": false}, {"title": "Coastal Joy", "lang": "en", "url": "https://raw.gitcode.com/shansjl/CutVoke/blobs/1bf878da94a891ec064638207a79fa8b96c27db3/examples/showcases/travel-vlog/videos/travel-vlog-case_en.mp4", "poster": "travel-vlog/previews/travel-vlog-poster_en.jpg", "portrait": true}, {"title": "海岸快乐日记", "lang": "zh-CN", "url": "https://raw.gitcode.com/shansjl/CutVoke/blobs/1c1c7dd76d5260d6381b9d8156bb1f25bfff4f37/examples/showcases/travel-vlog/videos/travel-vlog-case_zh-CN.mp4", "poster": "travel-vlog/previews/travel-vlog-poster_zh-CN.jpg", "portrait": true}];const films=document.getElementById('films');function render(){films.replaceChildren();for(const item of items.filter(x=>x.lang===document.getElementById('language').value)){const article=document.createElement('article');if(item.portrait)article.className='portrait';const title=document.createElement('h2');title.textContent=item.title;const video=document.createElement('video');video.controls=true;video.playsInline=true;video.preload='none';video.poster=item.poster;const source=document.createElement('source');source.src=item.url;source.type='video/mp4';video.append(source);const link=document.createElement('a');link.href=item.url;link.textContent=item.lang==='en'?'Download the original MP4':'下载原始 MP4';const error=document.createElement('p');error.hidden=true;error.className='note';error.textContent='视频暂时无法加载，请使用下方 MP4 下载链接。';video.addEventListener('error',()=>error.hidden=false);source.addEventListener('error',()=>error.hidden=false);article.append(title,video,error,link);films.append(article)}}document.getElementById('language').addEventListener('change',render);render();</script></html>
