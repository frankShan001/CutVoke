name: Bug report
description: Report a reproducible problem / 报告可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: English / 简体中文均可。Please search existing issues and remove private paths, tokens and media. 请先查重并脱敏；安全问题请按 SECURITY.md 私密报告。

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web editor
        - Editing engine
        - Preview or export
        - Audio or captions
        - CLI
        - HTTP API
        - MCP server
        - Packaging or installation
        - Other
    validations:
      required: true

  - type: dropdown
    id: install_type
    attributes:
      label: Install type / 安装类型
      options:
        - Windows portable / Windows 便携版
        - macOS arm64 / Apple Silicon
        - macOS x64 / Intel
        - Linux x64
        - Source checkout / 源码安装
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: CutVoke version / CutVoke 版本
      description: Use the app version or downloaded package filename. For a source checkout, include the commit if known. 填写应用版本或下载包文件名；源码安装请尽量附上 commit。
      placeholder: "0.3.5 / CutVoke-0.3.5-windows-x64-portable.zip"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >-
        Include your OS version and architecture. Desktop users do not need system Python or the `cutvoke` command;
        paste the last approximately 50 relevant lines of `profile/logs/engine.log` in Logs below.
        Find it inside `CutVoke Data` next to the Windows exe, `~/Library/Application Support/CutVoke/` on macOS,
        or `${XDG_DATA_HOME:-~/.local/share}/CutVoke/` on Linux.
        Source users should include Python, Node.js, browser and FFmpeg versions plus `cutvoke doctor --json`
        (`cutvoke doctor --mcp-only --json` for MCP-only installs).
        请填写系统版本与架构。桌面版无需系统 Python 或 `cutvoke` 命令，请在下方日志栏粘贴上述数据目录中
        `profile/logs/engine.log` 末尾约 50 行相关内容；源码版请附上各依赖版本和 doctor 输出。
        Remove private paths, tokens and media from all output. 所有输出请先移除私人路径、令牌及媒体信息。
      placeholder: |
        OS: Windows 11
        Architecture: x64
        Source installs only / 仅源码安装: Python / Node.js / browser / FFmpeg versions and doctor output
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use the smallest project and media sample that still shows the problem.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste only the relevant section and remove sensitive information.
