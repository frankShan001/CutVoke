name: Bug report
description: Report a reproducible problem / 报告可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: English / 简体中文均可。Please search existing issues and remove private paths, tokens and media. 请先查重并脱敏；安全问题请按 SECURITY.md 私密报告。

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web editor
        - Editing engine
        - Preview or export
        - Audio or captions
        - CLI
        - HTTP API
        - MCP server
        - Packaging or installation
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your operating system, Python version, browser, and `cutvoke doctor --json` output when relevant.
      placeholder: |
        OS: Windows 11
        Python: 3.12
        Browser: Chrome 140
        FFmpeg: 8.x
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use the smallest project and media sample that still shows the problem.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste only the relevant section and remove sensitive information.
