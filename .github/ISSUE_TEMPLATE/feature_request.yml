name: Feature request
description: Suggest a workflow or API change / 建议编辑流程或接口改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: English / 简体中文均可。Please check existing issues and CONTRIBUTING.md / 请先查重并阅读贡献指南。

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the editing task that is difficult today.
    validations:
      required: true

  - type: textarea
    id: workflow
    attributes:
      label: Expected workflow
      description: Explain how a person or Agent would use the feature from start to finish.
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where should it be available?
      multiple: true
      options:
        - Web editor
        - CLI
        - HTTP API
        - MCP server
        - Python API
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Examples or constraints
      description: Add references, compatibility concerns, or media examples if they help explain the request.
