name: Verified release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') && 'refs/tags/v0.3.4' || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.16'
      - name: Verify same-commit builds, stage and publish prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release/publish_verified.py
      - name: Resume only the bound verified v0.3.4 draft
        if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release/publish_verified.py --resume-release-id 426210812
      - name: Retain publication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-verification
          path: |
            .artifacts/release/BUILD-INFO.json
            .artifacts/release/SHA256SUMS
            .artifacts/release/recovery-verification.json
          if-no-files-found: warn
