name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/editor/package-lock.json

      - name: Inspect runner-provided Ubuntu mirrors
        # Preserve the hosted image's official mirror ordering and fallback.
        # Rewriting Azure to archive duplicated a host and prolonged DNS failures.
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            cat /etc/apt/apt-mirrors.txt
          fi

      - name: Refresh Ubuntu package indexes
        timeout-minutes: 5
        run: sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
      - name: Install and verify FFmpeg 6.1
        # Provisioning budget only: 105 MB of signed Ubuntu dependencies can
        # exceed five minutes on the runner mirror. Test deadlines are unchanged.
        timeout-minutes: 10
        run: |
          apt-cache policy ffmpeg
          sudo timeout --signal=TERM --kill-after=30s 9m apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y ffmpeg
          python tools/verify/check_ffmpeg61.py

      - name: Check Python sources
        env:
          PYTHONPATH: src
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src
          python -c "import cutvoke; from cutvoke.domain import model, protocol, rational; from cutvoke.rendering import render; from cutvoke.editing import service; from cutvoke.storage import store"
          python tools/verify/check_layering.py
          python tools/verify/check_asset_layout.py
          python tools/verify/check_repository_layout.py
          python -m pytest -q

      - name: Build Web editor
        working-directory: apps/editor
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Build and install wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel --outdir dist
          python tools/verify/verify_distribution.py dist
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python tools/verify/verify_packaged_caption_fonts.py --require-installed
          cutvoke doctor --json
          python -c "from pathlib import Path; import cutvoke; assert (Path(cutvoke.__file__).parent / 'web' / 'index.html').is_file()"

  browser:
    name: Browser editing workflow (${{ matrix.group }})
    env:
      CUTVOKE_E2E_PREVIEW_DIAGNOSTICS: "1"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        group: [full-1, full-2, state, recovery]
    # Independent runners/fixture servers split the full suite without changing
    # test deadlines. Repeated regressions run in their own isolated jobs.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/editor/package-lock.json
            apps/desktop/package-lock.json
      - name: Check desktop downloader dependencies
        working-directory: apps/desktop
        run: |
          npm ci --ignore-scripts
          npm run test:build-deps
      - name: Inspect runner-provided Ubuntu mirrors
        # Preserve the hosted image's official mirror ordering and fallback.
        # Rewriting Azure to archive duplicated a host and prolonged DNS failures.
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            cat /etc/apt/apt-mirrors.txt
          fi

      # Keep installation phases separate so live job metadata identifies a
      # stalled apt index, FFmpeg package, pip resolver, or browser download.
      - name: Refresh Ubuntu package indexes
        timeout-minutes: 5
        run: sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
      - name: Install and verify FFmpeg 6.1
        timeout-minutes: 10
        run: |
          apt-cache policy ffmpeg
          sudo timeout --signal=TERM --kill-after=30s 9m apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y ffmpeg
          python tools/verify/check_ffmpeg61.py
      - name: Install Python project and development dependencies
        timeout-minutes: 10
        run: |
          python -VV
          python -m pip --version
          python -m pip install -e ".[dev]"
      - name: Generate and verify packaged caption resources for browser scenarios
        timeout-minutes: 5
        run: |
          python -m pip install fontTools==4.66.1
          python tools/build/prepare_caption_fonts.py
          python tools/verify/verify_packaged_caption_fonts.py
      - name: Install browser and check editor helpers
        timeout-minutes: 15
        working-directory: apps/editor
        run: |
          npm ci
          npm run i18n:check
          npm run test:i18n
          npm run test:preview-cache
          npm run test:basic
          npx playwright install --with-deps chromium
      - name: Verify audio-first tutorial in the editor
        if: ${{ matrix.group == 'full-1' }}
        timeout-minutes: 8
        working-directory: apps/editor
        run: |
          npm run build
          npx playwright test --config=playwright.audio-tutorial.config.ts
      - name: Verify opt-in Quick Whip in the editor
        if: ${{ !cancelled() && matrix.group == 'full-1' }}
        timeout-minutes: 5
        working-directory: apps/editor
        env:
          CUTVOKE_E2E_PORT: "8801"
        run: npm run build && npx playwright test --config playwright.quick-whip.config.ts --output=../../.artifacts/test-results/quick-whip
      - name: Preserve Quick Whip UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quick-whip-ui-evidence-${{ matrix.group }}
          path: .artifacts/quick-whip-ui/
          if-no-files-found: ignore
          retention-days: 7
      - name: Repeat unchanged title flow with independent cold servers and font caches
        if: ${{ !cancelled() && matrix.group == 'full-1' }}
        timeout-minutes: 10
        run: |
          python tools/verify/test_cold_title_flow.py
          python tools/verify/verify_cold_title_flow.py
      - name: Preserve cold title traces and verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cold-title-evidence-${{ matrix.group }}
          path: .artifacts/cold-title/
          retention-days: 7
          if-no-files-found: ignore
      - name: Verify full-suite shard coverage
        if: ${{ startsWith(matrix.group, 'full-') }}
        working-directory: apps/editor
        run: python ../../tools/verify/check_browser_shards.py
      - name: Run full editor scenarios
        if: ${{ !cancelled() && startsWith(matrix.group, 'full-') }}
        id: editor_scenarios
        timeout-minutes: 40
        working-directory: apps/editor
        env:
          CUTVOKE_E2E_PORT: "8799"
        # Signal the whole process group before the Actions hard deadline,
        # allowing Playwright to close Chromium and its private fixture server.
        run: timeout --signal=TERM --kill-after=30s 39m npm run test:e2e -- --shard=${{ matrix.group == 'full-1' && '1/2' || '2/2' }} --output=../../.artifacts/test-results/full
      - name: Build editor for independent regressions
        if: ${{ !cancelled() && (matrix.group == 'state' || matrix.group == 'recovery') }}
        timeout-minutes: 5
        working-directory: apps/editor
        run: npm run build
      - name: Repeat deterministic state orderings
        # Independent matrix jobs preserve regressions even if a full shard fails.
        if: ${{ !cancelled() && matrix.group == 'state' }}
        # Three repetitions continued making progress at the old 15min cap.
        # This is an aggregate budget, not a change to any test timeout/retry.
        timeout-minutes: 25
        working-directory: apps/editor
        env:
          CUTVOKE_E2E_PORT: "8800"
        run: timeout --signal=TERM --kill-after=30s 24m npm run test:e2e:regressions:state -- --output=../../.artifacts/test-results/state
      - name: Repeat preview recovery and transcript orderings
        if: ${{ !cancelled() && matrix.group == 'recovery' }}
        timeout-minutes: 15
        working-directory: apps/editor
        env:
          # Never reuse a fixture server left by a cancelled earlier group.
          CUTVOKE_E2E_PORT: "8801"
        run: timeout --signal=TERM --kill-after=30s 14m npm run test:e2e:regressions:recovery -- --output=../../.artifacts/test-results/recovery
      - name: Preserve bounded preview stage diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preview-stage-diagnostics-${{ matrix.group }}
          path: .artifacts/preview-diagnostics/*.jsonl
          retention-days: 7
          if-no-files-found: ignore
      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-diagnostics-${{ matrix.group }}
          path: .artifacts/test-results/
          retention-days: 7
