name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/editor/package-lock.json

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check Python sources
        env:
          PYTHONPATH: src
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src
          python -c "import cutvoke; from cutvoke.domain import model, protocol, rational; from cutvoke.rendering import render; from cutvoke.editing import service; from cutvoke.storage import store"
          python tools/verify/check_layering.py
          python tools/verify/check_asset_layout.py
          python tools/verify/check_repository_layout.py
          python -m pytest -q

      - name: Build Web editor
        working-directory: apps/editor
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Build and install wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel --outdir dist
          python tools/verify/verify_distribution.py dist
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cutvoke doctor --json
          python -c "from pathlib import Path; import cutvoke; assert (Path(cutvoke.__file__).parent / 'web' / 'index.html').is_file()"

  browser:
    name: Browser editing workflow
    runs-on: ubuntu-24.04
    # Successful complete jobs took 19-30min; bound stalled hosted installs.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/editor/package-lock.json
            apps/desktop/package-lock.json
      - name: Check desktop downloader dependencies
        working-directory: apps/desktop
        run: |
          npm ci --ignore-scripts
          npm run test:build-deps
      # Keep installation phases separate so live job metadata identifies a
      # stalled apt index, FFmpeg package, pip resolver, or browser download.
      - name: Refresh Ubuntu package indexes
        timeout-minutes: 5
        run: sudo apt-get update
      - name: Install FFmpeg
        timeout-minutes: 5
        run: |
          sudo apt-get install -y ffmpeg
          ffmpeg -version
      - name: Install Python project and development dependencies
        timeout-minutes: 10
        run: |
          python -VV
          python -m pip --version
          python -m pip install -e ".[dev]"
      - name: Install browser and check editor helpers
        timeout-minutes: 15
        working-directory: apps/editor
        run: |
          npm ci
          npm run i18n:check
          npm run test:i18n
          npm run test:preview-cache
          npm run test:basic
          npx playwright install --with-deps chromium
      - name: Run full editor scenarios
        timeout-minutes: 40
        working-directory: apps/editor
        run: npm run test:e2e
      - name: Repeat deterministic state orderings
        timeout-minutes: 10
        working-directory: apps/editor
        run: npm run test:e2e:regressions
      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-diagnostics
          path: .artifacts/test-results/
          retention-days: 7
