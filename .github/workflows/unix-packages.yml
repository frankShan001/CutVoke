name: macOS and Linux packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/desktop/**
      - src/**
      - apps/editor/**
      - tools/build/**
      - tools/verify/**
      - .github/workflows/unix-packages.yml
      - .gitattributes
  push:
    branches: [main]
    paths:
      - apps/desktop/**
      - src/**
      - apps/editor/**
      - tools/build/**
      - tools/verify/verify_native_preview.cjs
      - tools/verify/verify_portable_unix.cjs
      - tools/verify/verify_unix_*
      - tools/verify/verify_linux_dialog.py
      - .github/workflows/unix-packages.yml
      - .gitattributes

permissions:
  contents: read

concurrency:
  group: unix-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Build and accept ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-arm64, runner: macos-15, builder: '--mac --arm64' }
          - { target: macos-x64, runner: macos-15-intel, builder: '--mac --x64' }
          - { target: linux-x64, runner: ubuntu-22.04, builder: '--linux --x64' }
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.16'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/editor/package-lock.json
      - name: Install Linux build and desktop test tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm ninja-build pkg-config libgtk-3-0 libnss3 libasound2 libgbm1 libatk-bridge2.0-0 libxss1 libdrm2 libxkbcommon0 xvfb xdotool openbox dbus-x11 scrot tesseract-ocr
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install nasm ninja pkg-config
      - name: Restore exact native FFmpeg
        id: ffmpeg-cache
        uses: actions/cache/restore@v5
        with:
          path: .artifacts/portable-ffmpeg
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('apps/desktop/ffmpeg-sources.json', 'tools/build/build_ffmpeg_unix.sh', 'tools/build/prepare_ffmpeg_sources.py') }}
      - name: Build FFmpeg from pinned sources with corresponding source
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install meson==1.10.0
          bash tools/build/build_ffmpeg_unix.sh
      - name: Verify native FFmpeg integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('.artifacts/portable-ffmpeg')
          for name,expected in json.loads((root/'SHA256.json').read_text()).items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==expected, name
          for name in ('ffmpeg','ffprobe'):
              assert (root/'bin'/name).stat().st_mode & 0o111
          PY
      - name: Cache verified FFmpeg before application acceptance
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .artifacts/portable-ffmpeg
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}
      - name: Prepare isolated frozen backend
        run: |
          python -m venv .artifacts/venv-portable
      - name: Restore verified Intel cryptography wheel
        if: matrix.target == 'macos-x64'
        id: intel-crypto-cache
        uses: actions/cache/restore@v5
        with:
          path: .artifacts/intel-crypto
          key: crypto-macos-x64-python313-${{ hashFiles('apps/desktop/intel-crypto-sources.json', 'apps/desktop/requirements-intel-crypto.lock', 'apps/desktop/requirements-build.lock', 'tools/build/build_macos_intel_crypto.py') }}
      - name: Build current cryptography for Intel from pinned source and static OpenSSL
        if: matrix.target == 'macos-x64'
        run: .artifacts/venv-portable/bin/python tools/build/build_macos_intel_crypto.py
      - name: Cache verified Intel cryptography before application acceptance
        if: matrix.target == 'macos-x64' && steps.intel-crypto-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .artifacts/intel-crypto
          key: ${{ steps.intel-crypto-cache.outputs.cache-primary-key }}
      - name: Install locked binary backend dependencies
        if: matrix.target != 'macos-x64'
        run: |
          .artifacts/venv-portable/bin/python -m pip install --require-hashes --only-binary=:all: -r apps/desktop/requirements-build.lock
      - name: Build Web editor
        working-directory: apps/editor
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Freeze native backend with bundled media tools
        run: |
          export CUTVOKE_FFMPEG_DIR="$GITHUB_WORKSPACE/.artifacts/portable-ffmpeg/bin"
          .artifacts/venv-portable/bin/python -m PyInstaller --noconfirm --distpath .artifacts/build/desktop-engine --workpath .artifacts/build/desktop-work apps/desktop/engine.spec
      - name: Verify Electron and package native app
        run: |
          npm ci --prefix apps/desktop
          npm run test:build-deps --prefix apps/desktop
          npm run test:i18n --prefix apps/desktop
          npm run test:storage --prefix apps/desktop
          python tools/build/prepare_desktop_unix.py
          npm run package:unix --prefix apps/desktop -- ${{ matrix.builder }}
      - name: Seal local ad-hoc macOS app for main and pull-request builds
        if: runner.os == 'macOS'
        run: .artifacts/venv-portable/bin/python tools/build/seal_macos_app.py
      - name: Assemble distribution preserving executable modes and symlinks
        run: .artifacts/venv-portable/bin/python tools/build/assemble_portable.py
      - name: Extract shipped archive and accept real macOS app
        if: runner.os == 'macOS'
        timeout-minutes: 12
        run: |
          export CUTVOKE_VERIFY_PYTHON="$GITHUB_WORKSPACE/.artifacts/venv-portable/bin/python"
          node tools/verify/verify_portable_unix.cjs
      - name: Extract shipped archive and accept real Linux app with sandbox
        if: runner.os == 'Linux'
        timeout-minutes: 12
        run: |
          export CUTVOKE_VERIFY_PYTHON="$GITHUB_WORKSPACE/.artifacts/venv-portable/bin/python"
          dbus-run-session -- xvfb-run -a bash -e -c '
            openbox > /tmp/cutvoke-openbox.log 2>&1 &
            node tools/verify/verify_portable_unix.cjs
          '
      - name: Upload verified download
        uses: actions/upload-artifact@v7
        with:
          name: CutVoke-${{ matrix.target }}
          path: dist/portable/*
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      - name: Preserve native build and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-evidence
          path: |
            .artifacts/acceptance/${{ matrix.target }}/*
            !.artifacts/acceptance/${{ matrix.target }}/中文 空格路径/**
            !.artifacts/acceptance/${{ matrix.target }}/用户 数据/**
            .artifacts/portable-ffmpeg/licenses/*
            dist/portable/download-info.json
            dist/portable/native-runtime.json
          retention-days: 90
          if-no-files-found: warn
